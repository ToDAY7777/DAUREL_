<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin · Daurel</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin">
  <header class="head"><a class="logo" href="./">daurel</a><span class="muted">Panel de administración</span>
    <button id="logout" class="btn small ghost">Cerrar sesión</button></header>

  <section id="login" class="panel narrow" hidden>
    <h2>Iniciar sesión</h2>
    <form id="login-form">
      <label>Correo<input id="email" type="email" required autocomplete="username"></label>
      <label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label>
      <button class="btn">Entrar</button>
    </form>
  </section>

  <div id="app" class="admin-grid" hidden>
    <section class="panel">
      <h2 id="form-title">Nuevo producto</h2>
      <form id="form">
        <input type="hidden" id="pid">
        <label>Título<input id="title" required maxlength="80"></label>
        <div class="two">
          <label>Precio (MXN)<input id="price" type="number" min="0" step="0.01" required></label>
          <label>Categoría<select id="category"></select></label>
        </div>
        <label>Descripción<textarea id="description" rows="4" placeholder="Materiales, medidas, colores, tiempo de entrega…"></textarea></label>
        <label>Fotos (la primera es la principal)<input id="files" type="file" accept="image/*" multiple></label>
        <div id="previews" class="previews"></div>
        <label class="check"><input id="is_new" type="checkbox" checked> Mostrar etiqueta NUEVO</label>
        <label class="check"><input id="active" type="checkbox" checked> Visible en la tienda</label>
        <div class="two"><button class="btn">Guardar producto</button><button type="button" id="cancel" class="btn ghost">Limpiar</button></div>
      </form>
    </section>
    <section class="panel"><h2>Productos</h2><ul id="list" class="list"></ul></section>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
